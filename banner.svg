<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="University Module Grade Calculator banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a33"/>
      <stop offset="1" stop-color="#1b4f8c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1130" cy="30" r="130" fill="#ffffff" opacity="0.05"/>
  <circle cx="70" cy="290" r="110" fill="#ffffff" opacity="0.05"/>

  <!-- calculator -->
  <g transform="translate(140,150)">
    <rect x="-56" y="-86" width="112" height="172" rx="14" fill="#10264a" stroke="#ffc857" stroke-width="3"/>
    <rect x="-44" y="-74" width="88" height="38" rx="6" fill="#071326"/>
    <text x="38" y="-46" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffc857">75%</text>
    <g fill="#2ec4b6">
      <circle cx="-28" cy="-8" r="10"/><circle cx="0" cy="-8" r="10"/><circle cx="28" cy="-8" r="10"/>
      <circle cx="-28" cy="22" r="10"/><circle cx="0" cy="22" r="10"/><circle cx="28" cy="22" r="10"/>
      <circle cx="-28" cy="52" r="10"/><circle cx="0" cy="52" r="10"/>
    </g>
    <circle cx="28" cy="52" r="10" fill="#ffc857"/>
  </g>

  <!-- title -->
  <text x="600" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="7" fill="#dbe8f7">UNIVERSITY MODULE</text>
  <text x="600" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#ffffff">Grade Calculator</text>
  <text x="600" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffc857">CAT1  +  CAT2  +  FAT  =  Final Grade %</text>

  <!-- illustrative weight bar -->
  <g>
    <rect x="260" y="232" width="136" height="12" rx="6" fill="#2ec4b6"/>
    <rect x="402" y="232" width="136" height="12" rx="6" fill="#5aa9e6"/>
    <rect x="544" y="232" width="396" height="12" rx="6" fill="#ffc857"/>
    <text x="328" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#dbe8f7">CAT1</text>
    <text x="470" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#dbe8f7">CAT2</text>
    <text x="742" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#dbe8f7">FAT</text>
  </g>

  <!-- graduation cap -->
  <g transform="translate(1060,140)">
    <path d="M-46,8 L-46,44 Q0,70 46,44 L46,8 L0,28 Z" fill="#2ec4b6"/>
    <polygon points="0,-54 84,-16 0,22 -84,-16" fill="#ffc857"/>
    <line x1="84" y1="-16" x2="84" y2="34" stroke="#ffc857" stroke-width="4" stroke-linecap="round"/>
    <circle cx="84" cy="40" r="7" fill="#ffc857"/>
  </g>
</svg>
